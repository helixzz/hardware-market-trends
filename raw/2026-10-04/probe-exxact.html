        <script>
            // Munchkin Consent Management for GDPR/Privacy Compliance
            window.munchkinConsent = {
                granted: false,
                initialized: false
            };

            // Expires a tracking cookie on both the host and the registrable domain. Munchkin and
            // ConversionPath scope theirs to the registrable domain, so a host-only delete misses them.
            function expireTrackingCookie(name) {
                var expired = '=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
                document.cookie = name + expired;
                var parts = location.hostname.split('.');
                if (parts.length > 2) {
                    document.cookie = name + expired + '; domain=.' + parts.slice(-2).join('.');
                }
            }

            // Expires every cookie whose name matches pattern. Shared by the ConversionPath
            // touch-history sweep and the Google Analytics / Bing UET sweep below — same problem
            // in both cases: per-property or per-stage suffixes make a name-only delete miss cookies.
            function expireCookiesByPrefix(pattern) {
                document.cookie.split(';').forEach(function(pair) {
                    var name = pair.split('=')[0].trim();
                    if (pattern.test(name)) {
                        expireTrackingCookie(name);
                    }
                });
            }

            // ConversionPath names its touch-history cookies <prefix>TouchHist_<stage> — initial,
            // rolling, recent, plus per-stage _freeze markers — where the prefix is "cp" or "rc"
            // depending on its cookies.useCompatibleNames option. There is no cookie called plain
            // "cpTouchHist", which is why deleting that single name never removed anything. Sweep by
            // prefix, and match both so flipping useCompatibleNames cannot silently break this again.
            function expireTouchHistoryCookies() {
                expireCookiesByPrefix(/^(cp|rc)TouchHist_/);
            }

            // Google Analytics (_ga, _ga_<PROPERTY>, _gac_*) and Google Ads click-linking cookies
            // (_gcl_au, _gcl_aw, _gcl_dc) are per-property/per-campaign, so a name-only delete misses
            // them the same way the old cpTouchHist single-name delete did. Sweep by prefix like
            // expireTouchHistoryCookies above.
            function expireAnalyticsCookies() {
                expireCookiesByPrefix(/^_ga/);
                expireCookiesByPrefix(/^_gcl/);
            }

            // RB2B writes a dozen-plus per-visitor cookies, all prefixed _reb2b (_reb2buid,
            // _reb2butk, _reb2bsessionID, _reb2bgeo, _reb2beid, _reb2bsha, _reb2bfxf, ...).
            // The set is undocumented and the vendor bundle is obfuscated, so enumerating
            // names would rot silently — sweep by prefix, same reasoning as the _ga and
            // cpTouchHist sweeps above (ST-3675).
            function expireRb2bCookies() {
                expireCookiesByPrefix(/^_re?b2b/);
            }

            // Microsoft Clarity is a Custom HTML tag inside the GTM container, so it loads only
            // after Termly releases GTM, well after the consent events below have fired. Its snippet
            // keeps an existing window.clarity and replays .q on load, so this stub queues the
            // consentv2 calls instead of losing them. Clarity's "cookies by default" setting is off,
            // so until a signal arrives it runs cookieless (ST-3710).
            window.clarity =
                window.clarity ||
                function() {
                    (window.clarity.q = window.clarity.q || []).push(arguments);
                };
            var lastClarityConsent = null;

            // Mirrors Termly's live state into Clarity, so Clarity follows the same regional
            // defaults as every other tag. Deduped because Termly reports the same state several
            // times per page load (immediate read, initialized, load-time consent broadcast).
            function syncClarityConsent(state) {
                if (!state) {
                    return;
                }
                var analytics = state.analytics ? 'granted' : 'denied';
                var ad = state.advertising ? 'granted' : 'denied';
                if (analytics + '|' + ad === lastClarityConsent) {
                    return;
                }
                lastClarityConsent = analytics + '|' + ad;
                window.clarity('consentv2', { ad_Storage: ad, analytics_Storage: analytics });
            }

            function grantAnalytics() {
                if (window.munchkinConsent.granted) {
                    return;
                }
                window.munchkinConsent.granted = true;
                // Clear any recorded opt-out so it cannot override a live grant. marketo.service's
                // initMunchkin() also does this, but it sits behind several conditions in another file
                // and is unreachable when the analytics scripts never loaded — don't depend on it.
                expireTrackingCookie('mkto_opt_out');
                window.dispatchEvent(new CustomEvent('munchkin-consent-granted'));
            }

            // Clears Marketo and ConversionPath tracking state. Deliberately not gated on the current
            // granted value: the poll below may not have observed a regional default-allow yet, and the
            // cleanup is idempotent. The touch-history cookies matter because left in place they survive
            // the decline and keep repopulating the rC_* form fields (see addHiddenFields in
            // marketo-form.component).
            //
            // isExpressedOptOut is true only for a real banner decline. A phantom load-time event means
            // no choice was made, so clear tracking state but do not persist a year-long opt-out the
            // visitor never asked for.
            function revokeAnalytics(isExpressedOptOut) {
                window.munchkinConsent.granted = false;
                if (isExpressedOptOut) {
                    document.cookie = 'mkto_opt_out=true; path=/; max-age=31536000';
                    // Google Analytics and Bing UET are third-party trackers, same as Marketo/CP
                    // above — only clear them on a real decline, never on the phantom load-time
                    // event, or every visitor's GA identity resets on every page load.
                    expireTrackingCookie('_gid');
                    expireTrackingCookie('_uetsid');
                    expireTrackingCookie('_uetvid');
                    expireAnalyticsCookies();
                    // RB2B is person-level identification, so leaving its cookies behind after a
                    // decline is worse than leaving GA's. Known gap: this fires on the analytics
                    // consent signal, so a visitor who declines advertising only while keeping
                    // analytics is not swept (ST-3675).
                    expireRb2bCookies();
                }
                expireTrackingCookie('_mkto_trk');
                expireTouchHistoryCookies();
                window.dispatchEvent(new CustomEvent('munchkin-consent-revoked'));
            }

            function initMunchkinConsentListeners() {
                if (typeof Termly === 'undefined') {
                    setTimeout(initMunchkinConsentListeners, 100);
                    return;
                }

                // Check current consent state immediately (in case Termly already initialized)
                var consentState = Termly.getConsentState();
                syncClarityConsent(consentState);
                if (consentState && consentState.analytics) {
                    grantAnalytics();
                }

                // Also listen for initialized event (for slow loads)
                Termly.on('initialized', function() {
                    var consentState = Termly.getConsentState();
                    syncClarityConsent(consentState);
                    if (consentState && consentState.analytics) {
                        grantAnalytics();
                    }
                });

                // Listen for consent changes
                Termly.on('consent', function(data) {
                    // Termly broadcasts a load-time consent event whose consentState is null, and it is
                    // indistinguishable from a real banner choice. Act on the live state and return
                    // before recording anything as explicit — otherwise a visitor who never interacted
                    // is recorded as having declined and has their tracking state cleared. Detect with:
                    //   Termly.on('consent', function(d) { console.log(d.consentState ? 'REAL' : 'PHANTOM', d); });
                    if (!data || !data.consentState) {
                        var liveState = Termly.getConsentState();
                        syncClarityConsent(liveState);
                        if (liveState && liveState.analytics) {
                            grantAnalytics();
                        } else {
                            revokeAnalytics(false);
                        }
                        return;
                    }

                    syncClarityConsent(data.consentState);
                    var hasAnalyticsConsent = data.consentState.analytics;

                    // Persist the explicit banner choice so form submissions can
                    // distinguish accepted/declined from never-interacted defaults
                    try {
                        localStorage.setItem('termly_explicit_choice', hasAnalyticsConsent ? 'accepted' : 'declined');
                    } catch (e) {}

                    if (hasAnalyticsConsent) {
                        grantAnalytics();
                    } else {
                        revokeAnalytics(true);
                    }
                });
            }

            // Start listening when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initMunchkinConsentListeners);
            } else {
                initMunchkinConsentListeners();
            }
